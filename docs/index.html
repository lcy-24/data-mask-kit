<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>data-mask-kit · 数据脱敏</title>
  <script type="importmap">
  { "imports": { "data-mask-kit": "https://cdn.jsdelivr.net/npm/data-mask-kit@1.0.0/dist/index.js" } }
  </script>
  <style>
    :root { --bg:#f7f8fa; --card:#fff; --border:#e5e7eb; --text:#1f2329; --muted:#6b7280; --accent:#3b82f6; --code:#f3f4f6; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); padding:24px; }
    .wrap { max-width:720px; margin:0 auto; }
    h1 { font-size:22px; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:14px; margin-bottom:24px; }
    .sub code { background:var(--code); padding:2px 6px; border-radius:4px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
    .card h2 { font-size:16px; margin:0 0 12px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    input { padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; flex:1; min-width:220px; }
    .out { font-family:"SF Mono",Menlo,monospace; background:var(--code); padding:10px 12px; border-radius:8px; font-size:15px; letter-spacing:.5px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .item label { font-size:12px; color:var(--muted); display:block; margin-bottom:4px; }
    @media(max-width:560px){ .grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>data-mask-kit</h1>
    <p class="sub">保留首尾、中间打码。安装：<code>npm i data-mask-kit</code></p>

    <div class="card">
      <h2>输入敏感信息，实时脱敏</h2>
      <div class="grid">
        <div class="item"><label>手机号（前3后4）</label><input id="phone" value="13812345678" /></div>
        <div class="item"><label>身份证（前6后4）</label><input id="idcard" value="110101199001011234" /></div>
        <div class="item"><label>银行卡（前6后4）</label><input id="bank" value="6222021234567890" /></div>
        <div class="item"><label>姓名（保留姓氏）</label><input id="name" value="欧阳娜娜" /></div>
        <div class="item"><label>邮箱（保留首字+域名）</label><input id="email" value="zhangsan@example.com" /></div>
        <div class="item"><label>通用（前2后2）</label><input id="str" value="abcdefg" /></div>
      </div>
    </div>

    <div class="card">
      <h2>脱敏结果</h2>
      <div class="grid">
        <div class="item"><label>手机号</label><div class="out" id="o-phone"></div></div>
        <div class="item"><label>身份证</label><div class="out" id="o-idcard"></div></div>
        <div class="item"><label>银行卡</label><div class="out" id="o-bank"></div></div>
        <div class="item"><label>姓名</label><div class="out" id="o-name"></div></div>
        <div class="item"><label>邮箱</label><div class="out" id="o-email"></div></div>
        <div class="item"><label>通用</label><div class="out" id="o-str"></div></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { maskPhone, maskIdCard, maskBankCard, maskName, maskEmail, maskString } from 'data-mask-kit'
    const bind = (id, fn) => {
      const inp = document.getElementById(id), out = document.getElementById('o-' + id)
      const update = () => { out.textContent = fn(inp.value) }
      inp.addEventListener('input', update); update()
    }
    bind('phone', maskPhone)
    bind('idcard', maskIdCard)
    bind('bank', maskBankCard)
    bind('name', maskName)
    bind('email', maskEmail)
    bind('str', (v) => maskString(v, 2, 2))
  </script>
</body>
</html>
